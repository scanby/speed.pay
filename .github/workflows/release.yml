name: Build & Release Windows Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server-win10:
    name: Build Server EXE (Windows 10/11 · Python 3.11)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Release Version into Server
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.0" }
          $outPath = Join-Path (Get-Location) "deliverables\server\VERSION"
          [System.IO.File]::WriteAllText($outPath, $ver, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Server VERSION set to: $ver"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server dependencies & PyInstaller
        shell: pwsh
        working-directory: deliverables/server
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run unit tests (Dominio, Idempotencia y SemVer)
        shell: pwsh
        working-directory: deliverables/server
        run: |
          python -m pytest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package NequiPayPOS_Server_Win10_11.exe
        shell: pwsh
        working-directory: deliverables/server
        run: |
          $pyiArgs = @(
            "--noconfirm",
            "--onefile",
            "--console",
            "--name", "NequiPayPOS_Server_Win10_11",
            "--paths", ".",
            "--hidden-import", "uvicorn.logging",
            "--hidden-import", "uvicorn.loops.auto",
            "--hidden-import", "uvicorn.loops.asyncio",
            "--hidden-import", "uvicorn.protocols.http.auto",
            "--hidden-import", "uvicorn.protocols.http.h11_impl",
            "--hidden-import", "uvicorn.protocols.websockets.auto",
            "--hidden-import", "uvicorn.lifespan.on",
            "--hidden-import", "websockets",
            "--hidden-import", "engineio.async_drivers.asgi",
            "--hidden-import", "pyttsx3.drivers.sapi5",
            "--add-data", "VERSION;.",
            "--add-data", "..\client_win7\web_pos;client_win7\web_pos",
            "app/main.py"
          )
          python -m PyInstaller @pyiArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\NequiPayPOS_Server_Win10_11.exe")) {
            Write-Error "Server EXE was not generated."
            exit 1
          }

      - name: Upload Server EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NequiPayPOS_Server_Win10_11
          path: deliverables/server/dist/NequiPayPOS_Server_Win10_11.exe

  build-client-win7:
    name: Build Client EXE (Windows 7 SP1 Compatible · Python 3.8)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Release Version into Win7 Client
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+.*)$') { $matches[1] } else { "1.0.0" }
          $outPath = Join-Path (Get-Location) "deliverables\client_win7\VERSION"
          [System.IO.File]::WriteAllText($outPath, $ver, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Client Win7 VERSION set to: $ver"

      # Python 3.8.10 x86 + PyInstaller 5.13.2 es la última cadena oficial compatible con Windows 7 SP1 (32 y 64 bits)
      - name: Setup Python 3.8 (32-bit x86 for Win7 compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"

      - name: Install Win7 client dependencies & PyInstaller 5.13.2
        shell: pwsh
        working-directory: deliverables/client_win7
        run: |
          python -m pip install --upgrade "pip<25" "setuptools<70" wheel
          python -m pip install -r requirements_win7.txt "pyinstaller==5.13.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package NequiPayPOS_Client_Win7.exe
        shell: pwsh
        working-directory: deliverables/client_win7
        run: |
          $pyiArgs = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name", "NequiPayPOS_Client_Win7",
            "--paths", ".",
            "--hidden-import", "tkinter",
            "--hidden-import", "engineio.async_drivers.threading",
            "--add-data", "VERSION;.",
            "agent_tray.py"
          )
          python -m PyInstaller @pyiArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\NequiPayPOS_Client_Win7.exe")) {
            Write-Error "Client Win7 EXE was not generated."
            exit 1
          }

      - name: Upload Client Win7 EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NequiPayPOS_Client_Win7
          path: deliverables/client_win7/dist/NequiPayPOS_Client_Win7.exe

  build-android-apk:
    name: Build Android Agent APK (Kotlin · Min SDK 26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compute APK Version Name & Code
        id: version
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-1.0.0}"
          CLEAN_VER="${RAW_TAG#v}"
          if [[ "$CLEAN_VER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            APP_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            if [ "$APP_CODE" -lt 1 ]; then APP_CODE=1; fi
          else
            CLEAN_VER="1.0.0"
            APP_CODE=1
          fi
          echo "APP_VERSION_NAME=$CLEAN_VER" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_CODE" >> "$GITHUB_ENV"
          echo "Android APK version set to: $CLEAN_VER (code $APP_CODE)"

      - name: Prepare Android Release Keystore
        shell: bash
        working-directory: deliverables/android_app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS_SECRET" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > release.keystore
            if [ ! -s release.keystore ]; then
              echo "Error: ANDROID_KEYSTORE_BASE64 decoded to an empty file."
              exit 1
            fi
            keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS_SECRET" >/dev/null
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$(pwd)/release.keystore" >> "$GITHUB_ENV"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASS" >> "$GITHUB_ENV"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "Configured and verified repository secret keystore (alias: $KEY_ALIAS_SECRET)."
          else
            echo "No ANDROID_KEYSTORE_* secrets found. Generating release keystore for installable APK..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias nequipos_agent \
              -storepass "NequiPayPOS_CI_2026" \
              -keypass "NequiPayPOS_CI_2026" \
              -dname "CN=NequiPay POS, OU=POS, O=NequiPay, L=Bogota, S=Cundinamarca, C=CO"
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=NequiPayPOS_CI_2026" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=nequipos_agent" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=NequiPayPOS_CI_2026" >> "$GITHUB_ENV"
          fi

      - name: Run Android Unit Tests (Nequi Notification Parser)
        shell: bash
        working-directory: deliverables/android_app
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APK
        shell: bash
        working-directory: deliverables/android_app
        run: |
          gradle assembleRelease --no-daemon -PversionName="$APP_VERSION_NAME" -PversionCode="$APP_VERSION_CODE"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "NequiPayPOS_Agent_Android.apk"
          ls -lh "NequiPayPOS_Agent_Android.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NequiPayPOS_Agent_Android
          path: deliverables/android_app/NequiPayPOS_Agent_Android.apk

  publish-release:
    name: Publish GitHub Release with EXEs, APK & SHA256
    needs: [build-server-win10, build-client-win7, build-android-apk]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Server EXE
        uses: actions/download-artifact@v4
        with:
          name: NequiPayPOS_Server_Win10_11
          path: release_assets

      - name: Download Client Win7 EXE
        uses: actions/download-artifact@v4
        with:
          name: NequiPayPOS_Client_Win7
          path: release_assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NequiPayPOS_Agent_Android
          path: release_assets

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash -Path release_assets\*.exe, release_assets\*.apk -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String |
            Set-Content -Path release_assets\SHA256SUMS.txt -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_assets/NequiPayPOS_Server_Win10_11.exe
            release_assets/NequiPayPOS_Client_Win7.exe
            release_assets/NequiPayPOS_Agent_Android.apk
            release_assets/SHA256SUMS.txt

